$kind: http-request
url: "{{request_url}}/{{org_name}}/{{app_name}}/chatfiles/{{file_uuid}}"
method: GET
headers:
  - key: Content-Type
    value: application/octet-stream
  - key: thumbnail
    value: "true"
  - key: share-secret
    value: "{{share_secret}}"
    description: optional in restrict-access is set to true
  - key: Accept
    value: application/octet-stream
settings: {}
order: 3000
