$kind: http-request
url: "{{request_url}}/{{org_name}}/{{app_name}}/thread/{{thread_id}}/users"
method: GET
headers:
  Content-Type: application/json
queryParams:
  - key: limit
    value: The range is [1, 50]
    disabled: true
  - key: cursor
    value: The page from which to start retrieving threads. Pass in null or an empty string at the first query
    disabled: true
settings: {}
order: 1000
